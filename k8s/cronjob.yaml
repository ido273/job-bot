# Deploy order:
#   1. cp k8s/secret.example.yaml k8s/secret.yaml, fill in real values, then:
#      kubectl apply -f k8s/secret.yaml
#   2. kubectl apply -f k8s/cronjob.yaml
#   3. kubectl apply -f k8s/dashboard.yaml
#
# Config lives on the shared PVC (not a ConfigMap) so the Phase 2 dashboard
# can write to it -- on first run, src/config.py seeds it from the image's
# baked-in config/config.yaml if the PVC path doesn't have one yet. After
# that, the PVC copy is the live one; edit it via the dashboard, or with
# `kubectl exec` into either pod if you need to touch it directly.
#
# NOTE: this PVC is mounted by both this CronJob's pods and the dashboard
# Deployment's pod. A ReadWriteOnce volume only supports that if both land
# on the same node -- fine for a single-node k3s box; on a multi-node
# cluster either pin both workloads to one node (nodeSelector/affinity) or
# switch storageClassName to something ReadWriteMany-capable (e.g. NFS).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-bot-data
  namespace: job-bot
spec:
  accessModes:
    - ReadWriteOnce
  suspend: true
  resources:
    requests:
      storage: 1Gi
      # storageClassName: local-path  # uncomment/adjust for your k3s storage class
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-bot-scraper
  namespace: job-bot
spec:
  # Fixed 10-min tick; the container itself adds a random 0-2.5min jitter
  # on top of this before actually scraping (see polling.jitter_minutes
  # in config.yaml), so requests to job sites don't land on a predictable
  # timestamp every time.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 900s (was 480s): every matched job now gets a synchronous AI-agent
      # relevance review before it's allowed to notify (see
      # src/agent/scoring.py, wired in src/main.py's run_cycle), each capped
      # at scoring_timeout_seconds (default 180s) -- a cycle with 2-3 slow
      # scores could realistically have hit the old 480s deadline.
      # concurrencyPolicy: Forbid below means a slow cycle only delays the
      # next tick, never stacks concurrent runs.
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          # This repo is private, so GHCR packages built from it are
          # private by default too -- the cluster needs credentials to
          # pull. ghcr-secret is created manually (kubectl create secret
          # docker-registry), not by this repo/ArgoCD, since it holds a
          # real credential.
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: job-bot
              image: ghcr.io/ido273/job-bot-scraper:4d41a1b # overwritten by .github/workflows/deploy.yml on every push to main
              args: ["--once"]
              env:
                - name: CONFIG_PATH
                  value: /app/data/config/config.yaml
                # Explicit, not left to config.yaml's `agent:` block --
                # confirmed live that config.yaml on the shared PVC was
                # seeded once at original setup and silently never picked up
                # a later addition of this block, so every Task 2 review
                # call was falling back to the "http://localhost:11434"
                # Python-level default (nothing listens there in this pod)
                # instead of the real in-cluster Ollama, every single cycle,
                # since the feature was first deployed. Same env vars
                # k8s/agent.yaml already sets for the discovery loop -- this
                # closes the same gap for the scraper's review step.
                - name: OLLAMA_BASE_URL
                  value: "http://ollama.job-bot.svc.cluster.local:11434"
                - name: SEARXNG_BASE_URL
                  value: "http://searxng.job-bot.svc.cluster.local:8080"
              envFrom:
                - secretRef:
                    name: job-bot-secrets
              volumeMounts:
                - name: data
                  mountPath: /app/data
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: job-bot-data
