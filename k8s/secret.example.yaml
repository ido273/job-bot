# Template only — copy to secret.yaml, fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# Never commit secret.yaml (it's already in .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: job-bot-secrets
  namespace: job-bot
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  TELEGRAM_CHAT_ID: "REPLACE_ME"
  # Only required if "whatsapp" is in notifications.channels
  WHATSAPP_ACCESS_TOKEN: "REPLACE_ME"
  WHATSAPP_PHONE_NUMBER_ID: "REPLACE_ME"
  WHATSAPP_RECIPIENT_NUMBER: "REPLACE_ME"
  # Only required if you set up the WhatsApp inbound webhook (bot commands)
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: "REPLACE_ME"
  WHATSAPP_APP_SECRET: "REPLACE_ME"
  # Dashboard basic auth (single user)
  DASHBOARD_USERNAME: "REPLACE_ME"
  DASHBOARD_PASSWORD: "REPLACE_ME"
